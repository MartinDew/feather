name: CI

on:
  push:
    branches: [ master, plugin-abi-rework ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        mode: [ debug, releasedbg, release ]
        config:
          # Disabled for now due to a lack of resources to test on MacOS. If you want to test on MacOS, uncomment the following lines and add a MacOS runner.
          # ── macOS (Apple Clang) ──────────────────────────────────────────
          # - name: macOS
          #   os: macos-latest
          #   toolchain_flag: ""
          

          # ── Linux (LLVM/Clang) ───────────────────────────────────────────
          - name: Linux
            os: ubuntu-24.04
            toolchain_flag: "--toolchain=gcc"

          # ── Windows (clang-cl) ───────────────────────────────────────────
          - name: Windows LLVM
            os: windows-latest
            toolchain_flag: "--toolchain=clang-cl"

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Python (required by codegen scripts; stdlib only, no pip install) ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Install xmake ─────────────────────────────────────────────────────
      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1

      # ── Vulkan SDK ────────────────────────────────────────────────────────
      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-use-cache: true
          vulkan-query-version: latest

      # ── LLVM (Linux + Windows) ────────────────────────────────────────────
      - name: Install LLVM
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20"

      # ── Linux system dependencies ─────────────────────────────────────────
      # clang itself is no longer installed here: it was only ever needed by
      # the reflection generator's old clang-AST backend (Linux compiles with
      # GCC, selected via --toolchain=gcc below). llvm-20 further down is
      # unrelated -- that one backs lld's gold-plugin LTO support, not codegen.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            lld \
            python3 \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxi-dev \
            libudev-dev

      - name: Install GCC
        uses: egor-tensin/setup-gcc@v2
        if: runner.os == 'Linux'
        with:
          version: "15"

      - name: Install SDL deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y git make \
          pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
          libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev  \
          libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      - name: Install LLVM Gold Plugin (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y binutils-gold llvm-20
          # The install-llvm-action tarball doesn't ship LLVMgold.so.
          # Clang resolves it relative to its own prefix, so we need it there.
          sudo mkdir -p "$LLVM_PATH/lib"
          sudo ln -sf /usr/lib/llvm-20/lib/LLVMgold.so "$LLVM_PATH/lib/LLVMgold.so"
          sudo mkdir -p /usr/lib/bfd-plugins
          sudo ln -sf /usr/lib/llvm-20/lib/LLVMgold.so /usr/lib/bfd-plugins/LLVMgold.so

      # ── Windows toolchain ─────────────────────────────────────────────────
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: k3DW/setup-msvc@v1
        with:
          vs-version: 17.14

      - name: Setup LLVM In Path
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Remove Strawberry Perl from PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Strawberry' }) -join ';'
          echo "PATH=$env:PATH" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Set UTF-8 Code Page (Windows)
        if: runner.os == 'Windows'
        run: chcp 65001

      # ── CMake (Linux) ─────────────────────────────────────────────────────
      # The runner image's preinstalled cmake wins over apt's (both land ahead
      # of it in PATH), but it's still too old for the "vex" package's
      # CMakeLists.txt (cmake_minimum_required 4.2.2) -- xmake's package
      # install step for vex fails outright, which is what was showing up as
      # an unexplained "Configure" exit 255 with no useful log text (see the
      # plugin-abi-rework branch history). pip's cmake package tracks upstream
      # releases closely, so grab that instead and put it first in PATH.
      - name: Install newer CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --upgrade cmake
          echo "$(python3 -c 'import sysconfig; print(sysconfig.get_path("scripts"))')" >> "$GITHUB_PATH"

      # ── Configure ─────────────────────────────────────────────────────────
      - name: Configure
        run: xmake f -m ${{ matrix.mode }} ${{ matrix.config.toolchain_flag }} -y

      # ── Dump failed package install logs (helps diagnose cmake build errors) ─
      - name: Dump failed package logs
        if: failure() && runner.os == 'Linux'
        run: |
          find ~/.xmake/cache/packages -name "install.txt" -path "*/installdir.failed/*" 2>/dev/null | while read f; do
            echo "========== $f =========="
            tail -300 "$f"
          done

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build
        run: xmake build -v

      # ── Plugin ABI coverage (see the plugin-abi-rework plan's Stage 4) ──────
      # Linux only for now: a project DLL can't load on Windows until Stage 5
      # (dllexport -> feather.lib, no tools/feather.def committed yet) lands --
      # see xmake/engine.lua's is_plat("windows") block. Extend to Windows once
      # that's in.
      - name: Checkout feather-example-project
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          repository: MartinDew/feather-example-project
          ref: project-sdk-integration
          path: feather-example-project

      - name: Build feather-example-project
        if: runner.os == 'Linux'
        working-directory: feather-example-project
        env:
          # Sidesteps the sibling-checkout convention feather-example-project's
          # own xmake.lua otherwise relies on (see its "FeatherEngine
          # discovery" block) -- actions/checkout's `path:` above puts it
          # under the FeatherEngine workspace, not next to it.
          FEATHER_ROOT: ${{ github.workspace }}
        run: |
          xmake f -m ${{ matrix.mode }} ${{ matrix.config.toolchain_flag }} -y
          xmake build -v

      # Verifies the ACTUAL failure mode Stage 2/3 targeted -- the project DLL
      # loading and running against the engine's declared export surface --
      # not a clean process exit. A SIGTERM-triggered shutdown with a project
      # loaded hits a separate, already-tracked pre-existing crash (see the
      # comment on Main's member list in core/main/feather_main.cpp); that's
      # not what this step checks, so it doesn't gate on the process's exit
      # status, only on what actually happened before the timeout fired.
      - name: Run plugin smoke test
        if: runner.os == 'Linux'
        run: |
          set +e
          # stdbuf: without it, feather's own stdout is fully buffered (not a
          # tty) and a crash discards whatever hadn't been flushed yet -- see
          # framework/assert.h's comment on why fassert() itself goes to
          # cerr instead. This is why a prior failure here showed nothing
          # but the crashing library's own (unbuffered) fatal line.
          timeout 10 stdbuf -oL -eL ./build/bin/feather feather-example-project --window-mode headless > smoke.log 2>&1
          set -e
          cat smoke.log
          if grep -qiE "undefined symbol|failed to load|failed loading" smoke.log; then
            echo "::error::project DLL failed to load -- plugin ABI is broken"
            exit 1
          fi
          if ! grep -q "importing module ExampleModule" smoke.log; then
            echo "::error::ExampleModule was never imported -- the plugin never loaded/ran"
            exit 1
          fi
          echo "Plugin loaded and ran correctly."

      # ── Upload artifacts ───────────────────────────────────────────────────
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: feather-${{ matrix.config.name }}-${{ matrix.mode }}
          path: build/bin/*
          if-no-files-found: warn
          retention-days: 7

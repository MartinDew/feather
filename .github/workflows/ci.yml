name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        mode: [ debug, releasedbg, release ]
        config:
          # Disabled for now due to a lack of resources to test on MacOS. If you want to test on MacOS, uncomment the following lines and add a MacOS runner.
          # ── macOS (Apple Clang) ──────────────────────────────────────────
          # - name: macOS
          #   os: macos-latest
          #   toolchain_flag: ""
          

          # ── Linux (LLVM/Clang) ───────────────────────────────────────────
          - name: Linux
            os: ubuntu-24.04
            toolchain_flag: "--toolchain=gcc"

          # ── Windows (clang-cl) ───────────────────────────────────────────
          - name: Windows LLVM
            os: windows-latest
            toolchain_flag: "--toolchain=clang-cl"

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Python (required by codegen scripts; stdlib only, no pip install) ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Install xmake ─────────────────────────────────────────────────────
      # Package cache on Linux only. The bindings modules add the mrbind
      # package, which is built from source, and the Python module compiles
      # four large translation units on top -- without a cache a Linux leg
      # doesn't finish in a sensible time. It stays off on Windows, where
      # enabling it coincided with thirdparty package installs going red and
      # master is green without it; the minutes there are worth less than
      # those builds working.
      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          package-cache: ${{ runner.os == 'Linux' }}
          package-cache-key: ${{ matrix.config.name }}-${{ matrix.mode }}
          project-path: "."

      # ── CMake/Ninja ───────────────────────────────────────────────────────
      - name: Setup cmake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      # ── Vulkan SDK ────────────────────────────────────────────────────────
      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-use-cache: true
          vulkan-query-version: latest

      # ── LLVM (Linux + Windows) ────────────────────────────────────────────
      - name: Install LLVM
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20"

      # ── Linux system dependencies ─────────────────────────────────────────
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            lld \
            python3 \
            libgl1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxi-dev \
            libudev-dev

      - name: Install GCC
        uses: egor-tensin/setup-gcc@v2
        if: runner.os == 'Linux'
        with:
          version: "15"

      - name: Install SDL deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y git make \
          pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
          libaudio-dev libfribidi-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
          libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
          libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev  \
          libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev

      # MRBind is a Clang tool: it needs a Clang install plus LLVM's and
      # Clang's CMake config packages (find_package(Clang) in turn does its own
      # find_package(LLVM)). With them, the package builds against this Clang;
      # without them it falls back to building LLVM from source, which takes
      # over twenty minutes. The runtime llvm-20 package below carries neither
      # config, so both -dev packages are required here.
      - name: Install Clang/LLVM development packages for MRBind (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y clang-20 llvm-20-dev libclang-20-dev

      - name: Install LLVM Gold Plugin (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y binutils-gold llvm-20
          # The install-llvm-action tarball doesn't ship LLVMgold.so.
          # Clang resolves it relative to its own prefix, so we need it there.
          sudo mkdir -p "$LLVM_PATH/lib"
          sudo ln -sf /usr/lib/llvm-20/lib/LLVMgold.so "$LLVM_PATH/lib/LLVMgold.so"
          sudo mkdir -p /usr/lib/bfd-plugins
          sudo ln -sf /usr/lib/llvm-20/lib/LLVMgold.so /usr/lib/bfd-plugins/LLVMgold.so

      # ── Windows toolchain ─────────────────────────────────────────────────
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: k3DW/setup-msvc@v1
        with:
          vs-version: 17.14

      - name: Setup LLVM In Path
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Remove Strawberry Perl from PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Strawberry' }) -join ';'
          echo "PATH=$env:PATH" >> $env:GITHUB_ENV
        shell: pwsh

      # Filtering PATH above isn't enough: assimp's CMakeLists finds ccache
      # with find_program, which searches beyond this job's PATH, and then sets
      # it as a compiler launcher. Strawberry Perl bundles a ccache that
      # mangles the cmcldeps.exe + rc.exe command line assimp's resource build
      # uses ("clang-cl: error: no such file or directory: '/fo'"), taking
      # sdl3 and vex down with it. Deleting the file sidesteps the search
      # entirely -- nothing finds what isn't there.
      - name: Remove stray Strawberry Perl ccache.exe (Windows)
        if: runner.os == 'Windows'
        run: Remove-Item -Path "C:\Strawberry\c\bin\ccache.exe" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Set UTF-8 Code Page (Windows)
        if: runner.os == 'Windows'
        run: chcp 65001

      # ── Configure ─────────────────────────────────────────────────────────
      - name: Configure
        run: xmake f -m ${{ matrix.mode }} ${{ matrix.config.toolchain_flag }} -y

      # ── Dump failed package install logs (helps diagnose cmake build errors) ─
      - name: Dump failed package logs
        if: failure()
        shell: bash
        run: |
          # Windows keeps xmake's cache under AppData rather than ~/.xmake, so
          # one of these two never exists. `|| true`: the step runs under
          # `set -e -o pipefail`, where find's non-zero exit for a missing
          # directory would abort it before printing anything.
          for root in ~/.xmake/cache/packages ~/AppData/Local/.xmake/cache/packages; do
            [ -d "$root" ] || continue
            find "$root" -name "install.txt" -path "*/installdir.failed/*" 2>/dev/null | while read f; do
              echo "========== $f =========="
              tail -300 "$f"
            done || true
          done

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build
        run: xmake build -v

      # ── Bindings ───────────────────────────────────────────────────────────
      # Everything a consumer project needs is supposed to land under
      # build/bindings; a silently empty directory would be easy to miss, since
      # generation failing doesn't necessarily fail the engine's own build.
      - name: Check bindings output
        shell: bash
        run: |
          set -e
          check() {
            if [ ! -e "$1" ]; then echo "missing: $1"; exit 1; fi
            echo "ok: $1"
          }
          check build/bindings/api.json
          check build/bindings/c/include
          check build/bindings/c/desc.json
          check build/bindings/csharp
          # The generated C headers a plugin includes through.
          check build/bindings/c/include/feather_c
          if [ "$RUNNER_OS" != "Windows" ]; then
            check build/bindings/python/feather.so
          fi

      # The C bindings are compiled into the engine and exported from it, which
      # is what a C or C# plugin resolves its imports against. A build that
      # generated the sources but dropped them from the link would still pass
      # every check above, so assert the symbols are actually in the binary.
      - name: Check the engine exports the C bindings
        if: runner.os != 'Windows'
        run: |
          set -e
          exported=$(nm -D --defined-only build/bin/feather | grep -c ' T Feather_' || true)
          if [ "$exported" -lt 100 ]; then
            echo "engine exports $exported Feather_* symbols; expected the generated bindings"
            exit 1
          fi
          echo "ok: engine exports $exported Feather_* symbols"

      # The Python module is deliberately NOT importable from a standalone
      # interpreter: it leaves engine symbols undefined and binds them to a
      # running engine process (see modules/py_bindings/xmake.lua). Checking
      # that it is built and has those undefined symbols is the honest test;
      # actually running it needs an engine, which the example project's
      # run_examples_test.sh covers.
      - name: Check the Python module targets the engine process
        if: runner.os != 'Windows'
        run: |
          set -e
          if nm -D --undefined-only build/bindings/python/feather.so | grep -q feather; then
            echo "ok: feather.so binds to the engine process"
          else
            echo "feather.so has no undefined engine symbols -- it was linked standalone"
            exit 1
          fi

      # ── The plugin-facing contract ─────────────────────────────────────────
      # A plugin project builds from the exported API file alone, with no engine
      # checkout. This runs that path the way a consumer would: publish the
      # file, then generate C headers and C# sources from it in a scratch
      # directory using only the flags recorded in its metadata. A break here
      # means every downstream plugin project breaks.
      - name: Export the API description
        run: xmake export-api

      - name: Generate bindings the way a plugin project would
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          python3 - <<'EOF'
          import json, os, shutil, subprocess, sys, glob

          meta = json.load(open("build/bindings/dist/feather_api.meta.json"))
          api = os.path.abspath("build/bindings/dist/feather_api.json")
          root = meta["feather_root"]
          print(f"engine {meta['engine_commit']}, mrbind {meta.get('mrbind_ref', '?')}")

          gen_c = shutil.which("mrbind_gen_c") or next(iter(glob.glob(
              os.path.expanduser("~/.xmake/packages/m/mrbind/*/*/bin/mrbind_gen_c"))), None)
          gen_cs = shutil.which("mrbind_gen_csharp") or next(iter(glob.glob(
              os.path.expanduser("~/.xmake/packages/m/mrbind/*/*/bin/mrbind_gen_csharp"))), None)
          if not gen_c or not gen_cs:
              sys.exit("could not locate the mrbind generators")

          out = os.path.abspath("build/consumer-smoke")
          shutil.rmtree(out, ignore_errors=True)
          # Exactly the flags tools/SDK/modules/feather_plugin_bindings.lua uses.
          subprocess.run([gen_c,
              "--input", api,
              "--output-header-dir", f"{out}/include",
              "--output-source-dir", f"{out}/unused-glue",
              "--helper-name-prefix", "Feather_",
              "--helper-macro-name-prefix", "FEATHER_C_",
              "--map-path", os.path.join(root, "core"), "feather_c",
              "--map-path", root, "feather_c/_root",
              "--assume-include-dir", root,
              "--clean-output-dirs",
              "--output-desc-json", f"{out}/desc.json",
              "--force-emit-common-helpers",
              "--helper-header-dir", "feather_helpers"], check=True)
          subprocess.run([gen_cs,
              "--input-json", f"{out}/desc.json",
              "--output-dir", f"{out}/csharp",
              "--imported-lib-name", "feather_c",
              "--helpers-namespace", "Feather::Misc",
              "--clean-output-dir"], check=True)

          for required in (f"{out}/include/feather_c", f"{out}/desc.json", f"{out}/csharp"):
              if not os.path.exists(required):
                  sys.exit(f"missing: {required}")
              print(f"ok: {required}")
          EOF

      # ── Upload artifacts ───────────────────────────────────────────────────
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: feather-${{ matrix.config.name }}-${{ matrix.mode }}
          path: build/bin/*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload bindings
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.config.name }}-${{ matrix.mode }}
          path: build/bindings/*
          if-no-files-found: warn
          retention-days: 7
